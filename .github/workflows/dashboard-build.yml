name: Dashboard and scientific-kernel validation

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  dashboard-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
  scientific-kernel-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install interchange schema validator
        run: python -m pip install -r requirements-interchange.txt
      - name: Run scientific and interchange tests
        run: python -m unittest discover -s tests -v
      - name: Generate reproducible experiment artifacts
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python -c "import os; from hf_science.metrics import export_experiment; print(export_experiment('artifacts', code_revision=os.environ['GITHUB_SHA']))"
      - name: Upload experiment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-intervention-artifacts
          path: artifacts/*.json
